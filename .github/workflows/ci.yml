name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:strict
      - run: npm run build
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run e2e
        env:
          # O preview local roda na raiz; os testes E2E não dependem do caminho do Pages.
          BASE_PATH: /
      # O E2E reconstrói o dist na raiz (BASE_PATH=/). O Pages precisa do app em /<repositório>/.
      - name: Build para o GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
